[package]
name = "bmo-text"
version = "0.1.0-rev.5"
description = "Markdown and text as a chat room reads them, written into Telegram's HTML, and the MCP server over them."
edition = "2024"
license = "MIT"
publish = false
# One test target, the harness at tests/main.rs (bmo-chat's docs/conventions.md, 「Rust builds」).
autotests = false

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"], optional = true }
fancy-regex = "0.19.2"
htmlize = { version = "1.1.0", features = ["unescape"] }
js-sys = { version = "0.3.103", optional = true }
lol_html = "3.0.1"
percent-encoding = "2.3.2"
regex = "1.13.1"
rmcp = { version = "3.5.1", default-features = false, features = ["server", "macros", "transport-io"], optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.154", optional = true }
tokio = { version = "1.54.0", features = ["rt", "io-std", "macros"], optional = true }
unicode-normalization = "0.1.26"
unicode-segmentation = "1.13.3"
url = "2.5.8"
# Held to the version of the `wasm-bindgen` command the build runs, which must be the same.
wasm-bindgen = { version = "=0.2.126", optional = true }

[features]
default = ["mcp"]
# The MCP server `bmo-text mcp` starts (docs/design.md, 「The MCP server」). It is on by default, so the crate's
# own tests reach it; the WebAssembly build and a consumer taking the readings alone leave it out.
mcp = ["dep:clap", "dep:rmcp", "dep:serde", "dep:serde_json", "dep:tokio"]
# The binding the package's WebAssembly build exports (docs/design.md, 「One implementation」).
wasm = ["dep:js-sys", "dep:serde_json", "dep:wasm-bindgen"]

[[bin]]
name = "bmo-text"
path = "src/bin/bmo-text.rs"
required-features = ["mcp"]

[dev-dependencies]
serde_json = "1.0.154"
toml = { version = "0.8.23", default-features = false, features = ["parse"] }

[[test]]
name = "main"
path = "tests/main.rs"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

[profile.test]
debug = "line-tables-only"
strip = "debuginfo"
incremental = false

[profile.release]
debug = false
strip = "debuginfo"

# The package's WebAssembly build, optimised for size.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
